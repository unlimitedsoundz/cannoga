<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cannoga Video Preview Player</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      max-width: 480px;
      flex: 1 1 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0;
      text-align: center;
      color: #f1f5f9;
    }
    video {
      width: 100%;
      max-height: 55vh;
      border-radius: 12px;
      background: #000;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    a.btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      text-decoration: none;
      background: #4f46e5;
      color: white;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Ad 1 -->
    <div class="card">
      <h1>Ad 1: Studying in Canada</h1>
      <video controls playsinline src="https://media.creatify.ai/amzptv/db0ec260-1ff6-46b6-9f27-843838ecc31c/lipsync_6317f62b_arora.mp4">
        Your browser does not support HTML video.
      </video>
      <div class="btn-group">
        <a class="btn" href="https://media.creatify.ai/amzptv/db0ec260-1ff6-46b6-9f27-843838ecc31c/lipsync_6317f62b_arora.mp4" download="Cannoga_Ad_1_Clean.mp4">Download Ad 1 (Clean MP4)</a>
      </div>
    </div>

    <!-- Ad 2 -->
    <div class="card">
      <h1>Ad 2: Todd - Senior Admissions Advisor</h1>
      <video controls autoplay playsinline src="https://media.creatify.ai/amzptv/b7a3bc2a-003d-40de-89ee-ef380fbfa8f2/lipsync_af7f1796_arora.mp4">
        Your browser does not support HTML video.
      </video>
      <div class="btn-group">
        <a class="btn" href="https://media.creatify.ai/amzptv/b7a3bc2a-003d-40de-89ee-ef380fbfa8f2/lipsync_af7f1796_arora.mp4" download="Cannoga_Ad_Todd_Admissions_Clean.mp4">Download Ad 2 (Clean MP4)</a>
      </div>
    </div>
  </div>
</body>
</html>
